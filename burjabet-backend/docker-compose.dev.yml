version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
      - "50051:50051"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: burja_user
      DB_PASSWORD: burja_password
      DB_NAME: burja_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: your-jwt-secret-key
      PORT: 3001
      GRPC_PORT: 50051
    volumes:
      - ./services/auth-service/src:/app/services/auth-service/src
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - burja-network

  game-engine-service:
    build:
      context: .
      dockerfile: services/game-engine-service/Dockerfile
    container_name: game-engine-service
    ports:
      - "3003:3003"
      - "50052:50052"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: burja_user
      DB_PASSWORD: burja_password
      DB_NAME: burja_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      PORT: 3003
      GRPC_PORT: 50052
    volumes:
      - ./services/game-engine-service/src:/app/services/game-engine-service/src
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - burja-network

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
      GAME_ENGINE_SERVICE_URL: http://game-engine-service:3003
      CORS_ORIGIN: http://localhost:3000
      PORT: 3004
    volumes:
      - ./services/gateway-service/src:/app/services/gateway-service/src
    depends_on:
      - auth-service
      - game-engine-service
    networks:
      - burja-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - burja-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - burja-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: burja_user
      POSTGRES_PASSWORD: burja_password
      POSTGRES_DB: burja_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - burja-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - burja-network

volumes:
  postgres_data:

networks:
  burja-network:
    driver: bridge
