apiVersion: batch/v1
kind: Job
metadata:
  name: game-engine-migrations
  namespace: burja
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: game-engine-migrations
    spec:
      imagePullSecrets:
        - name: acr-secret
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: bhanuburja.azurecr.io/burja-backend/game-engine-service:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              node node_modules/typeorm/cli.js migration:run -d dist/data-source.js
          envFrom:
            - configMapRef:
                name: burja-config
            - secretRef:
                name: burja-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
